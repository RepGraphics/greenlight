name: PC and Android test builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main-v2]
    paths:
      - '.github/workflows/device-test-builds.yml'
      - 'packages/pages/scripts/**'
      - 'packages/pages/src/**'
      - 'packages/desktop-v3/renderer/providers/trpc.tsx'
      - 'packages/desktop-v3/scripts/**'
      - 'packages/desktop/scripts/**'
      - 'packages/desktop/tests/smoke.cjs'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install matching dependencies
        run: yarn install --frozen-lockfile
      - name: Regression and portable asset-copy tests
        run: |
          yarn desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/pages/scripts/copy-web.test.cjs
      - name: Build V2 Windows desktop
        run: |
          yarn desktop build --no-pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/desktop/tests/smoke.cjs v2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          yarn desktop package:local --win --x64
      - uses: actions/upload-artifact@v7
        with:
          name: greenlight-v2-windows-x64-${{ github.sha }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
          if-no-files-found: error
      - name: Build shared V3 dependencies and web assets
        run: yarn build:pages
      - name: Verify static export
        run: |
          if (!(Test-Path packages/desktop-v3/web-out/home/index.html)) { throw 'Missing web build' }
          if (!(Test-Path packages/pages/public/home/index.html)) { throw 'Missing backend static assets' }
      - uses: actions/upload-artifact@v7
        with:
          name: greenlight-v3-web-${{ github.sha }}
          path: packages/desktop-v3/web-out/
          if-no-files-found: error
      - name: Build experimental V3 desktop ZIP
        run: |
          yarn desktopv3 build --no-pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path packages/desktop-v3/app/main.js)) { throw 'Missing V3 main entry' }
          if (!(Test-Path packages/desktop-v3/app/preload.js)) { throw 'Missing V3 preload entry' }
          node packages/desktop/tests/smoke.cjs v3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          yarn desktopv3 package:local --win zip --x64
      - uses: actions/upload-artifact@v7
        with:
          name: greenlight-v3-windows-x64-${{ github.sha }}
          path: packages/desktop-v3/dist/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Android connection policy tests
        working-directory: packages/android
        run: |
          mkdir -p /tmp/android-policy-test
          javac -d /tmp/android-policy-test app/src/main/java/uk/repgraphics/greenlight/companion/OriginPolicy.java app/src/main/java/uk/repgraphics/greenlight/companion/ConnectionMode.java app/src/main/java/uk/repgraphics/greenlight/companion/PlaybackDisplay.java app/src/main/java/uk/repgraphics/greenlight/companion/SavedConnection.java app/src/main/java/uk/repgraphics/greenlight/companion/ConnectionHealth.java tests/OriginPolicyTest.java
          java -cp /tmp/android-policy-test uk.repgraphics.greenlight.companion.OriginPolicyTest
      - name: Build and lint debug APK
        working-directory: packages/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: greenlight-android-debug-${{ github.sha }}
          path: packages/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  verify:
    name: Verify matching artifacts and local backend
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: greenlight-*-${{ github.sha }}
          path: test-artifacts
      - name: Verify expected files and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd test-artifacts
          test -n "$(find "greenlight-v2-windows-x64-$GITHUB_SHA" -type f -name '*.exe' -print -quit)"
          test -n "$(find "greenlight-v2-windows-x64-$GITHUB_SHA" -type f -name '*.zip' -print -quit)"
          test -n "$(find "greenlight-v3-windows-x64-$GITHUB_SHA" -type f -name '*.zip' -print -quit)"
          test -n "$(find "greenlight-android-debug-$GITHUB_SHA" -type f -name '*.apk' -print -quit)"
          test -f "greenlight-v3-web-$GITHUB_SHA/home/index.html"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/BUILD-COMMIT.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install matching backend dependencies
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build:depsv3
      - name: Prepare exact downloaded web assets
        run: |
          node -e 'require("./packages/pages/scripts/copy-web.cjs").copyWebExport("test-artifacts/greenlight-v3-web-"+process.env.GITHUB_SHA,"packages/pages/public")'
      - name: Smoke test local same-origin web and RPC
        shell: bash
        run: |
          set -euo pipefail
          setsid yarn pages dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/greenlight-worker.log" 2>&1 &
          worker=$!
          trap 'kill -- -"$worker" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8787/home/ -o "$RUNNER_TEMP/greenlight-home.html"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            tail -n 100 "$RUNNER_TEMP/greenlight-worker.log"
            exit 1
          fi
          test -s "$RUNNER_TEMP/greenlight-home.html"
          cmp "$RUNNER_TEMP/greenlight-home.html" "packages/pages/public/home/index.html"
          headers="$RUNNER_TEMP/greenlight-rpc.headers"
          status=$(curl --silent --show-error --max-time 10 -D "$headers" -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/trpc/test)
          test "$status" = 405
          grep -qi '^cache-control: no-store' "$headers"
          grep -qi '^allow: POST' "$headers"
          status=$(curl --silent --show-error --max-time 10 -X POST -D "$headers" -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/trpc/test?input=invalid')
          test "$status" = 400
          grep -qi '^cache-control: no-store' "$headers"
          status=$(curl --silent --show-error --max-time 10 -X POST -H 'Content-Type: application/json' -H 'Sec-Fetch-Site: cross-site' --data '{}' -D "$headers" -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/trpc/test)
          test "$status" = 403
          grep -qi '^cache-control: no-store' "$headers"
          status=$(curl --silent --show-error --max-time 10 -X POST -H 'Content-Type: text/plain' --data '{}' -D "$headers" -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/trpc/test)
          test "$status" = 415
          grep -qi '^cache-control: no-store' "$headers"
          python3 -c 'import sys; sys.stdout.write("x" * (2 * 1024 * 1024 + 1))' > "$RUNNER_TEMP/oversized-rpc-body"
          status=$(curl --silent --show-error --max-time 10 -X POST -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/oversized-rpc-body" -D "$headers" -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/trpc/test)
          test "$status" = 413
          grep -qi '^cache-control: no-store' "$headers"
          # Unknown procedure must be handled locally, without Xbox credentials or upstream requests.
          status=$(curl --silent --show-error --max-time 10 -X POST -H 'Content-Type: application/json' --data '{}' -D "$headers" -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/trpc/deviceBuildSmokeUnknown)
          test "$status" = 404
          grep -qi '^cache-control: no-store' "$headers"
      - uses: actions/upload-artifact@v7
        with:
          name: greenlight-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/BUILD-COMMIT.txt
          if-no-files-found: error
      - name: Summarize verified test builds
        shell: bash
        run: |
          {
            echo '## PC and Android test artifacts'
            echo
            echo "Commit: `$GITHUB_SHA`"
            echo
            echo 'Windows V2 installer/ZIP, V3 ZIP, static web export and Android debug APK are present.'
            echo 'The local web/RPC smoke checks passed; Xbox sign-in and physical playback were not tested.'
            echo 'Download all four matching artifacts and the verification artifact from this run. Extract each into its artifact-named directory to verify SHA256SUMS.txt.'
          } >> "$GITHUB_STEP_SUMMARY"
