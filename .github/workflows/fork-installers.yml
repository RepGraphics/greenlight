name: Fork desktop installers

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create an unpublished prerelease draft after all installers pass
        type: boolean
        default: false
        required: false
  push:
    branches: [main-v2]
    paths:
      - 'packages/desktop/**'
      - 'packages/player/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/fork-installers.yml'

permissions:
  contents: read

concurrency:
  group: fork-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'RepGraphics/greenlight'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run regression tests
        run: yarn desktop test
      - name: Build renderer and main process
        run: yarn desktop build --no-pack
      - name: Verify compiled Electron entry points
        working-directory: packages/desktop
        run: >-
          node -e "for (const f of [require('./package.json').main, 'app/preload.js']) { if (!require('node:fs').existsSync(f)) throw new Error('Missing compiled entry: ' + f) }"
      - name: Package installer without publishing
        working-directory: packages/desktop
        run: yarn run package:local
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: greenlight-fork-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.dmg
          if-no-files-found: error

  draft-release:
    name: Prepare draft development release
    if: github.repository == 'RepGraphics/greenlight' && github.ref == 'refs/heads/main-v2' && github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: greenlight-fork-*
          path: release-assets
      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging
          for platform in windows linux macos; do
            directory="release-assets/greenlight-fork-$platform"
            test -d "$directory"
            count=0
            while IFS= read -r -d '' file; do
              name="$platform-$(basename "$file")"
              test ! -e "release-staging/$name"
              cp "$file" "release-staging/$name"
              count=$((count+1))
            done < <(find "$directory" -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -print0)
            test "$count" -gt 0
          done
          (cd release-staging && sha256sum -- * > SHA256SUMS.txt)
          {
            printf '## Development build\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Windows, Linux and macOS installer jobs passed for this run. Builds may be unsigned; V3 remains experimental.\n\n'
            printf 'Verify downloaded files with SHA256SUMS.txt.\n\n'
            printf '## Recent changes\n\n'
            git log -20 --format='- %s (%h)' "$GITHUB_SHA"
            printf '\nSee the repository CHANGELOG.md for the full development summary.\n'
          } > release-notes.md
      - name: Create unpublished release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dev-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release-staging/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Development build ${GITHUB_SHA:0:12}" --notes-file release-notes.md --draft --prerelease
