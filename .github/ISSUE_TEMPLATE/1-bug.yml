name: Bug report
description: Report a problem in the Greenlight fork
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build version or commit SHA
      placeholder: main-v2 commit SHA or release version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, device and Xbox model
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Streaming engine
      options:
        - Classic
        - V3 experimental
        - Both
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Streaming service
      options:
        - Remote Play
        - Cloud Gaming
        - Both
        - Not applicable
  - type: dropdown
    id: controller
    attributes:
      label: Input device
      options:
        - Controller paired directly to Xbox
        - Controller paired to PC or handheld
        - Keyboard or mouse
        - Touch
        - Other / not applicable
  - type: textarea
    id: comparison
    attributes:
      label: Settings and comparison
      description: Include renderer, bitrate, controller mode, time until failure, whether audio stops, and whether Classic works.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and logs
      description: For V3, press F8 and export diagnostics from the toolbar. Attach JSON or relevant logs. Remove credentials, tokens, personal identifiers and private network details first.
  - type: checkboxes
    id: duplicate
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed sensitive information from attachments.
          required: true
