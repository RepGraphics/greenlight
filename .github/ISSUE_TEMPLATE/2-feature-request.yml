name: Feature request
description: Suggest an improvement to the Greenlight fork
title: "[Feature] "
labels: ["Feature request"]
body:
  - type: textarea
    id: description
    attributes:
      label: Proposed feature
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Describe your device, workflow and expected behaviour.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Dashboard and library
        - Classic player
        - V3 experimental player
        - Controller and handheld input
        - Installation and updates
        - Accessibility and translations
        - Other
  - type: textarea
    id: other
    attributes:
      label: Additional context
      description: Alternatives, references or mockups (no sensitive information).
